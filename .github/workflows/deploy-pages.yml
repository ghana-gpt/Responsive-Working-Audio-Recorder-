name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Restore the verified speech model
        uses: actions/cache@v4
        with:
          path: models/whisper-tiny
          key: whisper-tiny-${{ hashFiles('model-package.json') }}

      - name: Install the speech model
        # Idempotent: with the cache restored it only re-verifies every file
        # against model-package.json; otherwise it downloads the release asset,
        # checks the archive SHA-256 and each extracted file before installing.
        run: npm run models:download

      - name: Validate before deploying
        run: npm run validate

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest service-worker.js LICENSE README.md _site/
          cp -r icons scripts styles vendor _site/
          # The site needs vendor/audiobox/mp3-encoder.wasm, not the crate sources
          # it was built from — those stay in the repository for `npm run build:wasm`.
          rm -rf _site/vendor/audiobox-0.5.1
          # The Whisper model and the ONNX runtime binary ship with the site so
          # transcription works offline, with no CDN and no server.
          cp -r models _site/
          # Jekyll would otherwise try to process every file.
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
