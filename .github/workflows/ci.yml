name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, unit tests and browser e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Validate markup, manifest and service worker
        run: npm run validate:html

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: End-to-end test (Chromium)
        run: npm run test:e2e
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          E2E_STRICT: '1'

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: tests/e2e/.artifacts/
          if-no-files-found: ignore
          retention-days: 7
